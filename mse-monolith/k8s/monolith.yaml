# 单体模式入口：mse/mse-monolith（actuator 健康探针）
# 微服务模式请改用各启动器目录下的清单：mse-framework/mse-boot/boot-*/k8s/（gateway/system/tenant/auth）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mse-monolith
  labels:
    app: mse-monolith
    app.kubernetes.io/part-of: ai-mse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mse-monolith
  template:
    metadata:
      labels:
        app: mse-monolith
        app.kubernetes.io/part-of: ai-mse
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: mse-monolith
          image: mse/mse-monolith:1.0.0   # 按实际仓库/版本修改
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mse-config
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0"
            # Actuator 鉴权令牌（服务端 mse.actuator.auth.token 同键，见单体 application.yaml）：
            # 空值 = actuator 鉴权关闭、探针匿名可过（兼容未开启鉴权的集群）；生产接 Secret 注入
            - name: MSE_ACTUATOR_TOKEN
              value: ""
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:                  # actuator 默认全保护（含 health），探针带令牌头；镜像 temurin 21-jre 自带 curl
              command: ["sh", "-c", "curl -fs -H \"X-Actuator-Token: ${MSE_ACTUATOR_TOKEN}\" http://localhost:8080/actuator/health"]
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 20   # Spring Boot 冷启动较慢，给足启动窗口
          livenessProbe:
            exec:
              command: ["sh", "-c", "curl -fs -H \"X-Actuator-Token: ${MSE_ACTUATOR_TOKEN}\" http://localhost:8080/actuator/health"]
            initialDelaySeconds: 60
            periodSeconds: 10
          lifecycle:
            preStop:               # 留缓冲给注册中心/网关摘流量
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: mse-monolith
  labels:
    app: mse-monolith
spec:
  type: ClusterIP
  selector:
    app: mse-monolith
  ports:
    - name: http
      port: 8080
      targetPort: http
